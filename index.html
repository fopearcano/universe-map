<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>UNIVERSE MAP · local stellar neighbourhood</title>
    <meta name="description" content="Interactive 3D navigable HUD map of ~100,000 real stars with story-voyage tracking." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='3' fill='%2355e0ff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- 3D viewport -->
    <canvas id="viewport"></canvas>

    <!-- boot / loading -->
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">UNIVERSE&nbsp;MAP</div>
        <div class="boot-sub">loading stellar catalogue…</div>
        <div class="boot-bar"><i id="boot-bar-fill"></i></div>
        <div class="boot-log" id="boot-log"></div>
      </div>
    </div>

    <!-- fixed reticle at screen centre -->
    <svg id="reticle" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="16" />
      <line x1="50" y1="20" x2="50" y2="34" />
      <line x1="50" y1="66" x2="50" y2="80" />
      <line x1="20" y1="50" x2="34" y2="50" />
      <line x1="66" y1="50" x2="80" y2="50" />
    </svg>

    <!-- selection marker (positioned in JS) -->
    <div id="selmark" hidden>
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" /></svg>
    </div>

    <!-- top telemetry bar -->
    <header id="topbar">
      <div class="brand">
        <span class="logo">◉</span>
        <span>UNIVERSE&nbsp;MAP</span>
        <div class="modeswitch" id="modeswitch">
          <button class="ms" data-mode="system" title="the Solar System, to scale">☉ SYSTEM</button>
          <button class="ms active" data-mode="local">LOCAL</button>
          <button class="ms" data-mode="cosmos">COSMOS</button>
          <button class="ms" data-mode="deeptime" title="the far-future nested universe — a cosmic web of local groups (~50 Gyr)">⧗ DEEPTIME</button>
        </div>
        <button class="codexbtn" id="codex-btn" hidden title="open the Immeasurable Spaces codex">📖 CODEX</button>
        <button class="codexbtn" id="manual-btn" title="manual · controls & hotkeys (press ?)">❔ MANUAL</button>
        <button class="codexbtn navcom-ai-btn" id="navcom-ai-btn" title="ask Solaris.Ai — the Tekné NAVCOM agent">✦ NAVCOM AI</button>
      </div>
      <div class="telemetry" id="telemetry"></div>
    </header>

    <!-- search -->
    <div id="searchwrap">
      <input id="search" type="text" autocomplete="off" spellcheck="false"
             placeholder="◈ search  ·  name, HIP 32349, HD 48915, constellation…" />
      <div id="search-results"></div>
    </div>

    <!-- left dock: filters + voyages -->
    <aside id="leftdock">
      <div class="tabs">
        <button class="tab active" data-tab="filters">FILTERS</button>
        <button class="tab" data-tab="voyages">VOYAGES</button>
        <button class="tab" data-tab="atlas">ATLAS</button>
        <button class="tab" data-tab="layers">LAYERS</button>
      </div>
      <div class="tabpanel active" id="tab-filters"></div>
      <div class="tabpanel" id="tab-voyages"></div>
      <div class="tabpanel" id="tab-atlas"></div>
      <div class="tabpanel" id="tab-layers"></div>
    </aside>

    <!-- right dock: object info -->
    <aside id="infodock" hidden></aside>

    <!-- voyage player -->
    <div id="voyageplayer" hidden></div>

    <!-- bottom hint bar -->
    <footer id="hintbar">
      <span><b>drag</b> orbit</span>
      <span><b>right-drag</b> pan</span>
      <span><b>scroll</b> zoom</span>
      <span><b>click</b> select star</span>
      <span><b>dbl-click</b> fly to</span>
      <span class="grow"></span>
      <span id="fps">—</span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
